# Panse ERP — 生产部署 (群晖 DS923+ / 通用 Linux Docker)。
#
# 与 docker-compose.yml(开发) 的差异:
#   - 前端多阶段构建出静态文件, nginx 直接服务 (不暴露 vite dev server)
#   - 不挂源码卷; 容器 immutable
#   - api / db 不暴露端口, 只内部网络; nginx 终止 HTTPS
#   - 资源上限按群晖"保守"策略 (媒体服务挤占内存, 见 docs/群晖迁移_完整方案.md)
#   - 路径用 env 变量, 群晖在 .env 指到 /volume1/docker/panse/* (见 .env.example)
#   - 全部容器 TZ=Asia/Shanghai (18:00 下单图 / 次日 10:00 作废 / 06:30 取数 靠它)
#
# 启动:
#   cp .env.example .env   # 填 POSTGRES_PASSWORD / JWT_SECRET / SETTINGS_ENCRYPTION_KEY / PUBLIC_HOST / 路径
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-panse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-panse_erp}
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${TZ:-Asia/Shanghai}
    # 保守内存: 媒体服务挤占下别让 pg 缓存吃太多
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=50"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-panse}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768m
          # cpus 群晖内核(无 CPU CFS cgroup)不支持, 已去掉; 只用内存上限
        reservations:
          memory: 128m
    # 生产: 不暴露 5432 到宿主机

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_COMMIT_MSG: ${GIT_COMMIT_MSG:-}
        GIT_COMMIT_DATE: ${GIT_COMMIT_DATE:-}
        GIT_BRANCH: ${GIT_BRANCH:-}
        BUILD_TIME: ${BUILD_TIME:-}
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-panse}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-panse_erp}
      CORS_ORIGINS: "https://${PUBLIC_HOST:?must set PUBLIC_HOST}"
      JWT_SECRET: ${JWT_SECRET:?must set JWT_SECRET}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-24}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-4-6}
      TZ: ${TZ:-Asia/Shanghai}
      GALLERY_ROOT: /app/gallery
      AGENT_OUTPUT_DIR: /app/agent_output
      # 群晖: 设成 Windows 机局域网 IP, 如 http://192.168.x.x:8500 (空=不连 Web-Agent)
      WEB_AGENT_URL: ${WEB_AGENT_URL:-}
      # 绘图子程序 (独立部署, 见 docs/绘图子程序_交接方案.md); 空=不出图纸, 不报错
      DRAWING_SERVICE_URL: ${DRAWING_SERVICE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "alembic upgrade head &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health\", timeout=3)' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    volumes:
      - ${STORAGE_DIR:-./storage}:/app/storage
      # 图库改可写 (2026-06-14): 支持图库弹窗"上传新图"; 写入仅经 /api/gallery/upload, 路径受 _safe_resolve 限制在根内
      - ${GALLERY_DIR:-./gallery}:/app/gallery
      - ${AGENT_OUTPUT_DIR_HOST:-./agent_output}:/app/agent_output:ro
      - ${BACKUPS_DIR:-./backups}:/backups:ro
      - /etc/localtime:/etc/localtime:ro
    deploy:
      resources:
        limits:
          memory: 2g
          # cpus 群晖内核不支持, 去掉
        reservations:
          memory: 512m
    # 生产: 不暴露 8000, 由 nginx 反代

  web-build:
    # 一次性容器: 把 frontend 构建成静态文件丢到 web_dist 卷, 然后退出
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app:ro
      - web_dist:/dist
    command: >
      sh -c "cp -r /app /tmp/build && cd /tmp/build &&
             npm install --no-fund --no-audit &&
             npm run build &&
             rm -rf /dist/* && cp -r dist/* /dist/"
    restart: "no"

  web:
    image: nginx:alpine
    restart: always
    depends_on:
      web-build:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - web_dist:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
      - /etc/localtime:/etc/localtime:ro
    deploy:
      resources:
        limits:
          memory: 128m
          # cpus 群晖内核不支持, 去掉

  # 容器内自动备份 — 每天 03:00 dump 数据库, 保留 30 天 (与 Hyper Backup 异地备份互补)
  backup:
    image: postgres:16
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGUSER: ${POSTGRES_USER:-panse}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-panse_erp}
      PGHOST: db
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ${BACKUPS_DIR:-./backups}:/backups
      - /etc/localtime:/etc/localtime:ro
    entrypoint:
      - bash
      - -c
      - |
        echo "[backup] 启动. 每天 03:00 备份, 保留 30 天."
        set -o pipefail
        while :; do
          now_h=$$(date +%H); now_m=$$(date +%M); now_s=$$(date +%S)
          target_s=$$((3*3600))
          cur_s=$$((10#$$now_h*3600 + 10#$$now_m*60 + 10#$$now_s))
          if [ $$cur_s -lt $$target_s ]; then
            sleep_s=$$((target_s - cur_s))
          else
            sleep_s=$$((86400 - cur_s + target_s))
          fi
          echo "[backup] 等 $$sleep_s 秒到下个 03:00"
          sleep $$sleep_s
          fname="/backups/panse-$$(date +%Y%m%d-%H%M%S).sql.gz"
          echo "[backup] dump → $$fname"
          if pg_dump | gzip > "$$fname"; then
            sz=$$(stat -c%s "$$fname" 2>/dev/null || echo 0)
            if [ "$$sz" -gt 100 ]; then
              echo "[backup] OK $$(ls -lh $$fname | awk '{print $$5}')"
              find /backups -name 'panse-*.sql.gz' -mtime +30 -delete
            else
              echo "[backup] 失败: 产物过小 ($$sz 字节), 删坏文件保留旧备份"; rm -f "$$fname"
            fi
          else
            echo "[backup] pg_dump 失败, 删半成品保留旧备份"; rm -f "$$fname"
          fi
        done
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  pg_data:
  web_dist:
  certbot_webroot:
