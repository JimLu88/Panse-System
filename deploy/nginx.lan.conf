# Panse ERP — LAN-only nginx (http, 无域名 / 无证书)。镜像内自带前端静态站 + 反代 api。
# 访问: http://<NAS-IP>:8200 — 浏览器同源调用 /api → 这里反代到 api:8000, 无 CORS。
# 对照 AI 蜂群系统 h-semas 的 http://<NAS-IP>:8100 同源模式。HTTPS/域名版见 deploy/nginx.conf。

upstream panse_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 250m;   # CSV / Excel 导入 (历史对账单含图可能 100MB+)

    # FastAPI 反代 (同源, 无需 CORS)
    location /api/ {
        proxy_pass http://panse_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # SPA fallback — Vite 构建产物 (镜像内 /usr/share/nginx/html)
    root /usr/share/nginx/html;
    index index.html;

    # 带 hash 的静态资源(文件名随内容变)→ 永久缓存。regex location 优先级高于下面的 location /。
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 入口 + 路由 fallback。index.html 绝不缓存:
    # 否则新部署后浏览器拿旧 index → 引用的旧 JS hash 已删 → 404 → 白屏(踩过坑 2026-06-28)。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # 健康检查直通
    location = /health {
        access_log off;
        proxy_pass http://panse_api/api/health;
    }
}
