# Full 孚格 ERP deployment: same modules as畔色, independent runtime/data.
name: fuge-erp

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${FUGE_POSTGRES_USER:-fuge}
      POSTGRES_PASSWORD: ${FUGE_POSTGRES_PASSWORD:?Set a dedicated FUGE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${FUGE_POSTGRES_DB:-fuge_erp}
    volumes:
      - type: bind
        source: ${FUGE_DATA_ROOT:?Set a dedicated FUGE_DATA_ROOT}/postgres
        target: /var/lib/postgresql/data
      - type: bind
        source: ${FUGE_DATA_ROOT:?Set a dedicated FUGE_DATA_ROOT}/backups
        target: /backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [fuge_internal]

  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_COMMIT_MSG: ${GIT_COMMIT_MSG:-}
        GIT_COMMIT_DATE: ${GIT_COMMIT_DATE:-}
        GIT_BRANCH: ${GIT_BRANCH:-fuge}
        BUILD_TIME: ${BUILD_TIME:-}
    image: fuge-erp-api:${GIT_COMMIT:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -c 'from app.database import SessionLocal; from app.services.auth_service import ensure_default_admin; db=SessionLocal(); ensure_default_admin(db); db.close()' &&
             python -m app.cli.campaign_seed_sku_slots &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${FUGE_POSTGRES_USER:-fuge}:${FUGE_POSTGRES_PASSWORD}@db:5432/${FUGE_POSTGRES_DB:-fuge_erp}
      CORS_ORIGINS: ${FUGE_CORS_ORIGINS:-http://127.0.0.1:8290}
      JWT_SECRET: ${FUGE_JWT_SECRET:?Set a unique FUGE_JWT_SECRET}
      SETTINGS_ENCRYPTION_KEY: ${FUGE_SETTINGS_ENCRYPTION_KEY:?Set a unique FUGE_SETTINGS_ENCRYPTION_KEY}
      GALLERY_ROOT: /app/gallery
      STORAGE_ROOT: /app/storage
      AGENT_OUTPUT_DIR: /app/agent_output
      WEB_AGENT_URL: ${FUGE_WEB_AGENT_URL:-http://fuge-agent:8500}
      PROCUREMENT_AGENT_TOKEN: ${FUGE_PROCUREMENT_AGENT_TOKEN:-}
      DISABLE_SCHEDULER: ${FUGE_DISABLE_SCHEDULER:-1}
      DISABLE_WATCHDOG: ${FUGE_DISABLE_WATCHDOG:-0}
      ERP_INSTANCE_ID: fuge
      ERP_BRAND_CODE: FG
      ERP_BRAND_NAME: 孚格
      ERP_SHOP_NAME: ${FUGE_SHOP_NAME:-孚格家具}
    volumes:
      - type: bind
        source: ${FUGE_DATA_ROOT:?Set a dedicated FUGE_DATA_ROOT}/storage
        target: /app/storage
      - type: bind
        source: ${FUGE_DATA_ROOT:?Set a dedicated FUGE_DATA_ROOT}/gallery
        target: /app/gallery
      - type: bind
        source: ${FUGE_DATA_ROOT:?Set a dedicated FUGE_DATA_ROOT}/agent_output
        target: /app/agent_output
        read_only: true
      - type: bind
        source: ${FUGE_DATA_ROOT:?Set a dedicated FUGE_DATA_ROOT}/backups
        target: /backups
        read_only: true
    networks: [fuge_internal]

  web:
    build:
      context: ../..
      dockerfile: deploy/web.lan.Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_COMMIT_DATE: ${GIT_COMMIT_DATE:-}
        BUILD_TIME: ${BUILD_TIME:-}
        VITE_BRAND_CODE: FG
        VITE_BRAND_NAME: 孚格
        VITE_SHOP_NAME: ${FUGE_SHOP_NAME:-孚格家具}
        VITE_FUGE_ORIGIN: ${FUGE_PUBLIC_ORIGIN:-http://127.0.0.1:8290}
        VITE_PANSE_ORIGIN: ${PANSE_PUBLIC_ORIGIN:-http://127.0.0.1:8200}
    image: fuge-erp-web:${GIT_COMMIT:-local}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${FUGE_BIND_IP:-0.0.0.0}:8290:80"
    networks: [fuge_edge, fuge_internal]

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGUSER: ${FUGE_POSTGRES_USER:-fuge}
      PGPASSWORD: ${FUGE_POSTGRES_PASSWORD}
      PGDATABASE: ${FUGE_POSTGRES_DB:-fuge_erp}
      PGHOST: db
    volumes:
      - type: bind
        source: ${FUGE_DATA_ROOT:?Set a dedicated FUGE_DATA_ROOT}/backups
        target: /backups
    entrypoint:
      - bash
      - -c
      - >-
        set -e;
        while :; do
          sleep 86400;
          pg_dump | gzip > "/backups/fuge-$$(date +%Y%m%d-%H%M%S).sql.gz";
          find /backups -name 'fuge-*.sql.gz' -mtime +30 -delete;
        done
    networks: [fuge_internal]

networks:
  fuge_edge: {}
  fuge_internal:
    internal: true
