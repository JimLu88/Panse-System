# Panse ERP — production nginx config (plan §10 Phase 6 上线).
#
# 终端 HTTPS + 把 / → frontend 静态文件, /api → FastAPI uvicorn.
# 证书一次性用 certbot 拿好后挂到 /etc/letsencrypt/.

upstream panse_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name erp.example.com;
    # ACME 验证留通道，其它全 301 到 HTTPS
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name erp.example.com;

    ssl_certificate     /etc/letsencrypt/live/erp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 后端 CORS 已开, 这里只补常用安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 50m;   # CSV / Excel 导入

    # FastAPI 反代
    location /api/ {
        proxy_pass http://panse_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # SPA fallback — Vite 构建产物
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
        # 静态资源带 hash, 一年级长缓存
        location ~* \.(js|css|woff2?|png|jpg|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # 健康检查直通
    location = /health {
        access_log off;
        proxy_pass http://panse_api/api/health;
    }
}
