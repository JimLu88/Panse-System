<!-- @startingPoint section="移动端 App" subtitle="手机端 ERP：工作台 + 拍照录单 + 库存 + 我的" viewport="460x840" -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>畔色孚格 ERP — 移动端</title>
<link rel="stylesheet" href="../../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet">
<style>
  html, body { height: 100%; }
  body { margin: 0; background: var(--slate-100); font-family: var(--font-sans); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
  @keyframes mspin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="kit-m.jsx"></script>
<script type="text/babel" src="screens-m.jsx"></script>
<script type="text/babel">
const LS = 'panse-m-kit:tab';
function App() {
  const [tab, setTab] = React.useState(() => localStorage.getItem(LS) || 'home');
  React.useEffect(() => { localStorage.setItem(LS, tab); }, [tab]);
  const go = (t) => setTab(t);
  let body;
  if (tab === 'home') body = <HomeM go={go} />;
  else if (tab === 'capture') body = <CaptureM />;
  else if (tab === 'stock') body = <StockM />;
  else body = <MeM />;
  return <Phone tab={tab} onTab={setTab}>{body}</Phone>;
}
ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
