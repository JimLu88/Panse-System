<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; padding:0; background:var(--bg-app); font-family:var(--font-sans); }
  .pad { padding:20px 24px; }
  .sec { margin-bottom:22px; }
  .sec h4 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-tertiary); margin:0 0 10px; font-weight:600; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { TopNav, PageHeader, Tabs, Segmented, Button } = window.ERPDesignSystem_dc7e11;
function Demo() {
  const [tab,setTab] = React.useState('all');
  const [nav,setNav] = React.useState('orders');
  return (
    <div>
      <TopNav brand="畔色孚格 ERP" activeKey={nav} onSelect={setNav}
        items={[{key:'dashboard',label:'数据大盘'},{key:'products',label:'产品'},{key:'orders',label:'订单'},{key:'stock',label:'库存'},{key:'finance',label:'财务'}]}
        right={<><Button size="sm" variant="ghost">搜索</Button><Button size="sm" variant="ghost">通知</Button></>} />
      <div className="pad">
        <PageHeader breadcrumb={['订单','全部订单']} title="订单"
          subtitle="共 1,284 单 · 今日新增 36"
          extra={<><Button variant="secondary" size="sm">导出</Button><Button variant="primary" size="sm">新建订单</Button></>} />
        <div className="sec">
          <h4>Tabs</h4>
          <Tabs value={tab} onChange={setTab} items={[
            {key:'all',label:'全部',badge:1284},{key:'pending',label:'待处理',badge:36},
            {key:'shipped',label:'已发货'},{key:'done',label:'已完成'}]} />
        </div>
        <div className="sec">
          <h4>Segmented</h4>
          <Segmented defaultValue="30d" options={[
            {label:'今日',value:'today'},{label:'昨日',value:'yesterday'},
            {label:'近7天',value:'7d'},{label:'近30天',value:'30d'}]} />
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
