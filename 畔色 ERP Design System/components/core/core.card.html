<!-- @dsCard group="Components" viewport="700x420" name="Core · 按钮/标签/表单/卡片" subtitle="Button · Tag · Input · Select · Card · StatCard" -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; padding:22px 24px; background:var(--bg-app); font-family:var(--font-sans); }
  .sec { margin-bottom:20px; }
  .sec h4 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-tertiary); margin:0 0 10px; font-weight:600; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button, Tag, Input, Select, Card, StatCard } = window.ERPDesignSystem_dc7e11;
function Demo() {
  return (
    <div>
      <div className="sec">
        <h4>Button</h4>
        <div className="row">
          <Button variant="primary">主操作</Button>
          <Button variant="secondary">次要</Button>
          <Button variant="ghost">幽灵</Button>
          <Button variant="text">文本</Button>
          <Button variant="primary" danger>删除</Button>
          <Button variant="primary" loading>提交中</Button>
          <Button variant="secondary" disabled>禁用</Button>
          <Button variant="primary" size="sm">小号</Button>
        </div>
      </div>
      <div className="sec">
        <h4>Tag · 状态标签</h4>
        <div className="row">
          <Tag tone="success" dot>已对账</Tag>
          <Tag tone="warning">待处理</Tag>
          <Tag tone="danger" dot>超卖</Tag>
          <Tag tone="info">提示</Tag>
          <Tag tone="brand" solid>新</Tag>
          <Tag tone="default" closable>筛选项</Tag>
        </div>
      </div>
      <div className="grid2">
        <div className="sec" style={{marginBottom:0}}>
          <h4>Input / Select</h4>
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            <Input label="客户名称" required placeholder="请输入" />
            <Input prefix="¥" suffix="元/件" placeholder="0.00" />
            <Select placeholder="全部状态" defaultValue="paid" options={[
              {label:'待付款',value:'pending'},{label:'已付款',value:'paid'},{label:'已发货',value:'shipped'}]} />
          </div>
        </div>
        <div className="sec" style={{marginBottom:0}}>
          <h4>Card + StatCard</h4>
          <Card hoverable>
            <StatCard title="近 30 天收入" prefix="¥" value="1,284,560"
              delta="12.4%" deltaDir="up" footer="较上月" />
          </Card>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
