<!-- @dsCard group="Colors" viewport="700x180" name="品牌主色 · Google 蓝" subtitle="blue 色阶，主色 #1a73e8 (600)" -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-card); font-family: var(--font-sans); }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; }
  .chip { height: 64px; border-radius: var(--radius-md); box-shadow: inset 0 0 0 1px rgba(15,23,42,.05); }
  .name { font-size: 12px; color: var(--text-secondary); margin-top: 8px; font-weight: var(--weight-medium); }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
  .tag { display:inline-block; font-size:10px; font-weight:600; color:var(--on-primary); background:var(--primary); padding:1px 6px; border-radius:var(--radius-pill); margin-left:6px; vertical-align:middle; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--blue-50)"></div><div class="name">50</div><div class="hex">#e8f0fe</div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-100)"></div><div class="name">100</div><div class="hex">#d2e3fc</div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-200)"></div><div class="name">200</div><div class="hex">#aecbfa</div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-300)"></div><div class="name">300</div><div class="hex">#8ab4f8</div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-400)"></div><div class="name">400</div><div class="hex">#669df6</div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-500)"></div><div class="name">500 <span class="tag">品牌</span></div><div class="hex">#4285f4</div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-600)"></div><div class="name">600 <span class="tag">主色</span></div><div class="hex">#1a73e8</div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-700)"></div><div class="name">700</div><div class="hex">#1967d2</div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-800)"></div><div class="name">800</div><div class="hex">#185abc</div></div>
    <div class="sw"><div class="chip" style="background:var(--blue-900)"></div><div class="name">900</div><div class="hex">#174ea6</div></div>
  </div>
</body>
</html>
