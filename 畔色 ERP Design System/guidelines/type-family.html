<!-- @dsCard group="Type" viewport="700x200" name="字体家族" subtitle="Noto Sans SC (界面) + JetBrains Mono (数字)" -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-card); font-family: var(--font-sans); }
  .block { margin-bottom: 18px; }
  .meta { font-size:11px; font-family:var(--font-mono); color:var(--text-tertiary); margin-bottom:6px; }
  .sans { font-family: var(--font-sans); font-size: 26px; color: var(--text-primary); font-weight:600; }
  .mono { font-family: var(--font-mono); font-size: 24px; color: var(--text-primary); font-weight:500; }
  .small { font-size:13px; color:var(--text-secondary); font-weight:400; }
</style>
</head>
<body>
  <div class="block">
    <div class="meta">--font-sans · Noto Sans SC</div>
    <div class="sans">畔色孚格 ERP 系统 · 进销存对账</div>
    <div class="sans small">The quick brown fox · 现代清爽，可读性优先</div>
  </div>
  <div class="block">
    <div class="meta">--font-mono · JetBrains Mono (金额/编号对齐)</div>
    <div class="mono">¥ 1,284,560.00 &nbsp; SKU-20260622 &nbsp; 0123456789</div>
  </div>
</body>
</html>
