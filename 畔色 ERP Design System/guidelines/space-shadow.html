<!-- @dsCard group="Spacing" viewport="700x190" name="阴影 / 聚焦环" subtitle="柔和低对比，主色聚焦环" -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 28px 24px; background: var(--surface-card); font-family: var(--font-sans); }
  .row { display:flex; gap:26px; align-items:center; }
  .item { text-align:center; }
  .box { width:84px; height:60px; background:var(--white); border-radius:var(--radius-lg); }
  .lab { font-size:11px; font-family:var(--font-mono); color:var(--text-tertiary); margin-top:14px; }
  .ring { box-shadow: var(--focus-ring); border:1px solid var(--primary); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="lab">xs</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="lab">sm</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="lab">md</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="lab">lg</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xl)"></div><div class="lab">xl</div></div>
    <div class="item"><div class="box ring"></div><div class="lab">focus-ring</div></div>
  </div>
</body>
</html>
