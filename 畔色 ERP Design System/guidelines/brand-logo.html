<!-- @dsCard group="Brand" viewport="700x220" name="Logo 标识" subtitle="字母标 + 中英文字标 (临时字标，待正式 Logo)" -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:24px; background:var(--surface-card); font-family:var(--font-sans); }
  .row { display:flex; gap:28px; align-items:center; flex-wrap:wrap; }
  .mark { width:64px; height:64px; border-radius:18px; background:linear-gradient(135deg,var(--teal-400),var(--teal-600)); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:32px; box-shadow:var(--shadow-md); }
  .lock { display:flex; align-items:center; gap:12px; }
  .lock .m2 { width:44px; height:44px; border-radius:12px; background:linear-gradient(135deg,var(--teal-400),var(--teal-600)); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:22px; }
  .wm { display:flex; flex-direction:column; line-height:1.05; }
  .wm .cn { font-size:26px; font-weight:800; letter-spacing:-.02em; color:var(--text-primary); }
  .wm .en { font-size:11px; font-weight:600; letter-spacing:.32em; color:var(--text-tertiary); margin-top:3px; }
  .ondark { background:var(--teal-900); border-radius:var(--radius-lg); padding:18px 22px; }
  .ondark .cn { color:#fff; } .ondark .en { color:var(--teal-300); }
</style>
</head>
<body>
  <div class="row">
    <div class="mark">畔</div>
    <div class="lock"><div class="m2">畔</div><div class="wm"><span class="cn">畔色孚格 ERP</span><span class="en">PANSE FUGE</span></div></div>
    <div class="lock ondark"><div class="m2">畔</div><div class="wm"><span class="cn">畔色孚格</span><span class="en">PANSE FUGE</span></div></div>
  </div>
</body>
</html>
