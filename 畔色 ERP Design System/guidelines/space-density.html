<!-- @dsCard group="Spacing" viewport="700x230" name="表格密度" subtitle="紧凑 40 · 默认 48 · 宽松 56" -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px 24px; background: var(--surface-card); font-family: var(--font-sans); color:var(--text-primary); }
  .wrap { display:flex; gap:16px; }
  .col { flex:1; }
  h4 { font-size:12px; color:var(--text-tertiary); font-weight:600; margin:0 0 8px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td { padding:0 10px; border-bottom:1px solid var(--border-subtle); color:var(--text-secondary); }
  .c td { height:var(--row-compact); }
  .d td { height:var(--row-default); }
  .s td { height:var(--row-spacious); }
  .n { font-family:var(--font-mono); text-align:right; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="col"><h4>紧凑 40px</h4><table class="c"><tr><td>SKU-001</td><td class="n">128</td></tr><tr><td>SKU-002</td><td class="n">64</td></tr><tr><td>SKU-003</td><td class="n">12</td></tr></table></div>
    <div class="col"><h4>默认 48px</h4><table class="d"><tr><td>SKU-001</td><td class="n">128</td></tr><tr><td>SKU-002</td><td class="n">64</td></tr><tr><td>SKU-003</td><td class="n">12</td></tr></table></div>
    <div class="col"><h4>宽松 56px</h4><table class="s"><tr><td>SKU-001</td><td class="n">128</td></tr><tr><td>SKU-002</td><td class="n">64</td></tr><tr><td>SKU-003</td><td class="n">12</td></tr></table></div>
  </div>
</body>
</html>
