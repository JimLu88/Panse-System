name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-sqlite:
    name: backend tests (sqlite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest
        env:
          DATABASE_URL: "sqlite:///:memory:"
          DISABLE_WATCHDOG: "1"
          DISABLE_SCHEDULER: "1"
          DISABLE_RATE_LIMIT: "1"
        run: pytest -q -p no:cacheprovider

  backend-postgres:
    name: migrations + e2e (postgres)
    runs-on: ubuntu-latest
    # 套件单测走内存 sqlite (conftest 固定); 此 job 主要验证 alembic 迁移在真 PG 能跑通 +
    # e2e (TestClient 走 app 引擎=PG)。Plan C5: 迁移已在真 PG 反复验证, 收紧为阻塞性检查。
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: panse
          POSTGRES_PASSWORD: panse_test_pw
          POSTGRES_DB: panse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U panse"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: alembic upgrade head (validate migrations on real PG)
        env:
          DATABASE_URL: "postgresql+psycopg2://panse:panse_test_pw@localhost:5432/panse_test"
        run: alembic upgrade head
      - name: pytest
        env:
          DATABASE_URL: "postgresql+psycopg2://panse:panse_test_pw@localhost:5432/panse_test"
          DISABLE_WATCHDOG: "1"
          DISABLE_SCHEDULER: "1"
          DISABLE_RATE_LIMIT: "1"
        run: pytest -q -p no:cacheprovider

  frontend:
    name: frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: typecheck + build (tsc -b && vite build)
        run: npm run build

  e2e-smoke:
    name: frontend e2e smoke (playwright)
    runs-on: ubuntu-latest
    # 首次/偶发不稳先不阻塞主流程; 稳定后去掉 continue-on-error
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: playwright smoke
        run: npm run e2e
