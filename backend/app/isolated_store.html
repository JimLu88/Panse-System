<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>孚格 ERP</title><style>body{font:16px system-ui;margin:30px auto;max-width:1000px;padding:0 20px;background:#f5f2ec;color:#26332e}nav{display:flex;gap:14px;margin-bottom:30px}a,button{padding:10px 16px;border:1px solid #82968b;border-radius:8px;background:white;color:#234c3b;text-decoration:none;cursor:pointer}a[aria-current]{background:#234c3b;color:white}section{background:white;padding:22px;border-radius:12px;margin:16px 0}input,textarea{padding:10px;margin:5px;border:1px solid #aaa;border-radius:6px}textarea{display:block;width:90%;height:180px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #ddd}#status{white-space:pre-wrap}img{max-width:160px;max-height:160px;margin:5px}</style>
<nav><a id="panse">畔色 ERP</a><a href="/stores/__STORE_ID__" aria-current="page">孚格 ERP · 独立数据</a></nav>
<h1>孚格产品与定价</h1><p>孚格专属资料库与图库。商品和图片独立保存，登录沿用畔色主账号。订单、财务、通知和平台操作尚未启用。</p>
<section id="login"><h2>登录孚格</h2><input id="username" placeholder="畔色主账号" autocomplete="username"><input id="password" placeholder="密码" type="password" autocomplete="current-password"><button id="signIn">登录</button></section>
<main hidden id="workspace"><section><h2>产品资料与图库</h2><p>已确认资料与候选规格分开保存；价格未核实的产品保持草稿。</p><input id="catalogQuery" placeholder="产品编号或名称"><button id="catalogSearch">查找产品</button><div id="catalogList"></div></section><section id="catalogDetail" hidden><h2 id="catalogTitle"></h2><div id="catalogFacts"></div><div id="catalogGallery"></div><button id="moreCatalog">加载更多图片</button></section><section><h2>商品规格</h2><input id="code" placeholder="商家编码"><input id="name" placeholder="商品名"><input id="spec" placeholder="完整 SKU 规格"><button id="add">添加规格</button><button id="refresh">刷新</button><button id="export">导出本店数据</button><button id="logout">退出</button><table><thead><tr><th>编码（导入项为草稿码）</th><th>商品 / 规格</th><th>操作</th></tr></thead><tbody id="products"></tbody></table></section>
<section id="detail" hidden><h2 id="selected"></h2><input id="image" type="file" accept="image/jpeg,image/png,image/webp"><button id="upload">上传本店图片</button><div id="gallery"></div><h3>逐规格定价核算</h3><p>填写已确认的竞品来源与全部参数。只保存计算记录，不修改已有报价或发布到淘宝。</p><div id="priceFields"></div><label><input id="couponExcluded" type="checkbox">来源价格未扣店铺券或个人券，且不是未经核实的划线原价</label><label><input id="confirmed" type="checkbox">以上口径、优惠和参数已确认</label><button id="calculate">核算并保存证据</button></section></main><p id="status" role="status"></p>
<script>
const STORE='__STORE_ID__',base='/api/stores/'+STORE;let token=sessionStorage.getItem('store:'+STORE+':token')||'',selected=null,blobs=[];
const $=id=>document.getElementById(id);const say=v=>$('status').textContent=typeof v==='string'?v:JSON.stringify(v,null,2);
// Separate origin navigation: no auth, resource IDs or request state carried to Panse.
const panse=new URL(location.href);panse.port='8200';panse.pathname='/';panse.search='';panse.hash='';$('panse').href=panse.href;
async function api(path,options={}){const headers={'X-Store-ID':STORE,...options.headers};if(token)headers.Authorization='Bearer '+token;const r=await fetch(base+path,{...options,headers,cache:'no-store'});if(!r.ok){if(r.status===401)logout();throw Error(await r.text())}return r}
function logout(){clearCatalog();$('catalogList').replaceChildren();$('catalogDetail').hidden=true;token='';selected=null;sessionStorage.removeItem('store:'+STORE+':token');$('workspace').hidden=true;$('login').hidden=false;$('products').replaceChildren();clearGallery();$('detail').hidden=true}
function clearGallery(){for(const url of blobs)URL.revokeObjectURL(url);blobs=[];$('gallery').replaceChildren()}
async function refresh(){const data=await(await api('/products')).json();$('workspace').hidden=false;$('login').hidden=true;$('products').replaceChildren();await catalogRefresh();for(const p of data.items){const tr=document.createElement('tr');for(const text of [p.code,p.name+' / '+p.specification]){const td=document.createElement('td');td.textContent=text;tr.append(td)}const td=document.createElement('td'),button=document.createElement('button');button.textContent='图片 / 核算';button.onclick=()=>run(async()=>{selected=p;$('selected').textContent=p.name+' / '+p.specification;$('detail').hidden=false;$('confirmed').checked=false;await gallery()});td.append(button);tr.append(td);$('products').append(tr)}}
async function gallery(){clearGallery();const result=await(await api('/products/'+selected.id+'/media')).json();for(const m of result.items){const r=await api('/media/'+m.id+'?thumbnail=true');const url=URL.createObjectURL(await r.blob());blobs.push(url);const img=document.createElement('img');img.src=url;img.alt=selected.name;$('gallery').append(img)}}
async function run(fn){try{await fn()}catch(e){say(e.message)}}
$('signIn').onclick=()=>run(async()=>{const r=await(await api('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})})).json();token=r.token;sessionStorage.setItem('store:'+STORE+':token',token);$('password').value='';await refresh();say('已登录孚格独立环境')});
$('add').onclick=()=>run(async()=>{await api('/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('code').value,name:$('name').value,specification:$('spec').value})});await refresh();say('已保存本店规格')});
$('refresh').onclick=()=>run(refresh);$('logout').onclick=logout;
$('upload').onclick=()=>run(async()=>{if(!selected||!$('image').files.length)throw Error('先选择商品和图片');const form=new FormData();form.append('file',$('image').files[0]);await api('/products/'+selected.id+'/media',{method:'POST',body:form});await gallery();say('图片已保存到孚格独立图库')});
const fields=[['source_item_id','竞品商品ID'],['source_sku_id','竞品SKU ID'],['specification','竞品完整规格'],['source_url','竞品来源链接'],['observed_at','采集时间（含时区，如 2026-10-24T18:00:00+08:00）'],['platform_pre_coupon_price','竞品当前平台券前价（不扣店铺券、个人券）'],['conditions','适用条件'],['discount_components','优惠组成说明'],['list_price','拟定一口价'],['single_item_rate','单品宝系数（如0.75，需确认）'],['official_rate','官方立减比例（如0.15，需确认）']];
for(const [key,label] of fields){const l=document.createElement('label');l.style.display='block';l.textContent=label;const input=document.createElement('input');input.id='price_'+key;input.style.width='65%';l.append(input);$('priceFields').append(l)}
$('calculate').onclick=()=>run(async()=>{const payload=Object.fromEntries(fields.map(([key])=>[key,$('price_'+key).value]));payload.confirmed=$('confirmed').checked;payload.rule_version='fuge-explicit-price-v2';payload.price_basis='platform_pre_coupon';payload.shop_and_personal_coupons_excluded=$('couponExcluded').checked;const r=await(await api('/products/'+selected.id+'/calculate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})).json();say('核算已保存（未发布平台）：\n一口价 '+r.list_price+' 元\n日常 / 报名价 '+r.signup_price+' 元\n官方立减 '+r.official_deduction+' 元\n单品立减 '+r.single_deduction+' 元\n最终到手 '+r.verified_final+' 元')});
$('export').onclick=()=>run(async()=>{const r=await api('/export');const url=URL.createObjectURL(await r.blob());const a=document.createElement('a');a.href=url;a.download='fuge-export.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
let catalogBlobs=[],catalogImages=[],catalogOffset=0,catalogEpoch=0;
function clearCatalog(){catalogEpoch++;for(const u of catalogBlobs)URL.revokeObjectURL(u);catalogBlobs=[];$('catalogGallery').replaceChildren()}
async function catalogRefresh(){const d=await(await api('/catalog?q='+encodeURIComponent($('catalogQuery').value))).json();$('catalogList').replaceChildren();for(const p of d.items){const b=document.createElement('button');b.textContent=p.source_key+' · '+p.title+'（'+p.image_count+'图）';b.style.cssText='display:block;margin:8px 0;text-align:left;width:100%';b.onclick=()=>run(()=>catalogOpen(p));$('catalogList').append(b)}}
async function catalogOpen(p){clearCatalog();$('catalogDetail').hidden=false;$('catalogTitle').textContent=p.source_key+' '+p.title;const m=p.metadata;$('catalogFacts').replaceChildren();const line=(label,value)=>{const el=document.createElement('p');el.textContent=label+'：'+value;$('catalogFacts').append(el)};line('主材',m.material||'待补充');line('正式售价','待核实，未启用');line('原ERP商家编码',m.original_erp_product_code||'未核实');line('文案',m.description||'待补充');for(const s of m.confirmed_skus||[]){line('已确认规格',Object.values(s.specification).join(' / '));line('本地草稿码',s.local_draft_sku_code+'（不是已核实的原ERP商家编码）');line('用户指定初始数量',s.stock);const h=s.historical_approved_draft_prices;if(h)line('历史草稿价（不是当前正式价格）','一口价 '+h.list_price+' / 日常 '+h.daily_price+' / 中促 '+h.medium_promo_price+' / 大促 '+h.big_promo_price)}for(const c of m.candidate_dimensions||[])line('候选规格，尚未确认可售',c.variant+' · '+Object.entries(c.dimensions_cm||{}).map(([k,v])=>k+' '+v+'cm').join('，'));line('历史参考',((m.historical_reference||[]).length)+'条，仅作来源参考，不作为当前价格');line('图库状态','候选素材，不代表已批准发布；未自动绑定正式SKU');catalogImages=(await(await api('/catalog/'+p.id+'/media')).json()).items;catalogOffset=0;await moreCatalog()}
async function moreCatalog(){const epoch=catalogEpoch;const batch=catalogImages.slice(catalogOffset,catalogOffset+18);catalogOffset+=batch.length;for(const m of batch){const r=await api('/catalog-media/'+m.id);if(epoch!==catalogEpoch)return;const u=URL.createObjectURL(await r.blob());catalogBlobs.push(u);const im=document.createElement('img');im.src=u;im.alt=m.category+' '+m.original_name;im.title=im.alt;$('catalogGallery').append(im)}$('moreCatalog').hidden=catalogOffset>=catalogImages.length}
$('catalogSearch').onclick=()=>run(catalogRefresh);$('moreCatalog').onclick=()=>run(moreCatalog);window.addEventListener('pagehide',clearCatalog);
if(token)run(refresh);window.addEventListener('pagehide',clearGallery);
</script></html>
