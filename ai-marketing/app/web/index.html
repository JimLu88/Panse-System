<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>畔色/孚格 · 内容矩阵工作台</title>
<style>
  :root{--bg:#f5f3ef;--card:#fff;--line:#e7e3dc;--ink:#2b2925;--sub:#857f74;--accent:#8a6d4f;--accent2:#a98b66;--green:#3f9d5a;--yellow:#bf8f1e;--red:#c4503e;--blue:#4a7eb5;--shadow:0 1px 3px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.04);--radius:12px}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
  header{background:var(--ink);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  header h1{font-size:16px;margin:0;font-weight:600;margin-right:auto}
  header .tag{font-size:12px;color:#d8cbb4;background:#403c35;padding:3px 9px;border-radius:11px;white-space:nowrap}
  #navtoggle{display:none;background:#403c35;color:#fff;border:0;border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
  .layout{display:flex;min-height:calc(100vh - 50px)}
  nav{width:196px;background:#fff;border-right:1px solid var(--line);padding:10px 8px;flex-shrink:0;overflow-y:auto}
  nav .group{font-size:11px;color:var(--sub);padding:12px 12px 4px;letter-spacing:1px;font-weight:600}
  nav button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14px;color:var(--ink);text-align:left;margin-bottom:2px;line-height:1.3}
  nav button:hover{background:#f3efe9}
  nav button.on{background:var(--accent);color:#fff;font-weight:500}
  nav button .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;border-radius:9px;padding:1px 7px;min-width:18px;text-align:center}
  nav button.on .badge{background:#fff;color:var(--accent)}
  main{flex:1;padding:22px;max-width:1000px;width:100%}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);overflow-x:auto}
  .guide{background:linear-gradient(#fcf8f1,#fbf5ea);border:1px solid #ecddc6;border-radius:var(--radius);padding:13px 16px;margin-bottom:16px;font-size:14px;line-height:1.8;color:#6b5a42}
  .guide b{color:var(--accent)}
  .steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:14px}
  .steps .s{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:12px;color:var(--sub)}
  .steps .s b{display:block;color:var(--ink);font-size:13px;margin-top:3px}
  .steps .s .n{display:inline-block;width:21px;height:21px;line-height:21px;text-align:center;background:var(--accent);color:#fff;border-radius:50%;font-size:12px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button.act{background:var(--accent);color:#fff;border:0;padding:9px 16px;border-radius:9px;cursor:pointer;font-size:14px;min-height:38px;font-weight:500}
  button.act:hover{background:#7a5f44}
  button.act:disabled{opacity:.4;cursor:not-allowed}
  button.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);padding:8px 13px;border-radius:9px;cursor:pointer;font-size:13px;min-height:36px}
  button.ghost:hover{border-color:var(--accent);color:var(--accent)}
  input,select,textarea{padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;background:#fff;min-height:38px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{width:100%;min-height:64px;line-height:1.6}
  .muted{color:var(--sub);font-size:12.5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .stat .c{background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px;cursor:pointer;transition:border-color .15s,transform .1s}
  .stat .c:hover{border-color:var(--accent);transform:translateY(-1px)}
  .stat .c .num{font-size:30px;font-weight:700;line-height:1.1}
  .stat .c .lbl{font-size:12.5px;color:var(--sub);margin-top:3px}
  .stat .c.urgent .num{color:var(--red)}
  .pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:10px;background:#e8f3ea;color:var(--green);white-space:nowrap}
  .pill.y{background:#fbf2d6;color:var(--yellow)}.pill.r{background:#f9e3df;color:var(--red)}.pill.b{background:#eee;color:var(--sub)}.pill.bl{background:#e4eef7;color:var(--blue)}
  h3{margin:0 0 10px;font-size:16px}
  h3 .sub{font-weight:400;color:var(--sub);font-size:12.5px;margin-left:6px}
  .kv{font-size:14px;line-height:1.8}
  .hl{background:#fbe6c8;border-radius:3px;padding:0 3px;font-weight:500}
  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:max-content}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--sub);font-weight:500;white-space:nowrap}
  .empty{color:var(--sub);font-size:14px;padding:28px 14px;text-align:center}
  .empty:before{content:"📭";display:block;font-size:28px;margin-bottom:6px;opacity:.6}
  .timeline{font-size:12.5px;color:var(--sub);border-left:2px solid var(--line);padding-left:12px;margin-top:8px}
  .timeline div{margin:4px 0}
  .ck{cursor:pointer;user-select:none}
  .copybtn{font-size:12px;padding:4px 10px;min-height:30px}
  @media(max-width:860px){
    body{font-size:15px}
    #navtoggle{display:block}
    .layout{flex-direction:column}
    nav{width:100%;border-right:0;border-bottom:1px solid var(--line);max-height:50vh;display:none}
    nav.open{display:block}
    nav .group{padding-top:8px}
    main{padding:16px}
    header h1{font-size:15px}
  }
</style>
</head>
<body>
<header>
  <h1>🪵 畔色/孚格 · 内容矩阵工作台</h1>
  <button id="navtoggle" onclick="document.getElementById('nav').classList.toggle('open')">☰ 菜单</button>
  <span class="tag" id="llm">…</span>
  <span class="tag" id="ds"></span>
  <span class="tag" id="wd"></span>
</header>
<div class="layout">
<nav id="nav"></nav>
<main id="view"></main>
</div>

<script>
const $ = (s,e=document)=>e.querySelector(s);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(m,u,b,retried){
  const tok=localStorage.getItem('api_token');
  const r=await fetch(u,{method:m,headers:{'content-type':'application/json',...(tok?{authorization:'Bearer '+tok}:{})},body:b?JSON.stringify(b):undefined});
  if(r.status===401&&!retried){const nt=prompt('该服务已开启鉴权，请输入 API Token：');if(nt){localStorage.setItem('api_token',nt);return api(m,u,b,true);}}
  if(!r.ok)throw new Error((await r.json()).detail||r.status);
  const ct=r.headers.get('content-type')||'';return ct.includes('json')?r.json():r.text();
}
const flag=f=>`<span class="pill ${f==='green'?'':f==='yellow'?'y':'r'}">${f==='green'?'正常':f==='yellow'?'注意':'异常'}</span>`;
const roleCN=r=>({brand:'品牌专业号',persona:'人设小号',review:'垂类测评',spare:'备用孵化',zhihu:'知乎'}[r]||r);
const copy=t=>{navigator.clipboard?.writeText(t);toast('已复制');};
function toast(m){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#2c2a26;color:#fff;padding:8px 18px;border-radius:20px;z-index:99;font-size:13px';document.body.appendChild(d);setTimeout(()=>d.remove(),1400);}

const MENU=[
  ['开始',[['home','🏠 今日待办']]],
  ['内容生产',[['hotnotes','🔥 爆文挖掘'],['pipe','①② 选题与生成'],['avatar','🎭 数字人工作室'],['clips','✂️ 视频切片'],['review','③ 审核工位'],['queue','④ 发布队列'],['calendar2','📆 内容日历']]],
  ['引流获客',[['comment','⑤ 评论引流'],['inbox','💌 评论管理'],['mentions','📡 品牌舆情'],['lead','⑥ 线索收件箱'],['crm','👤 客户库'],['zhihu','⑦ 知乎占坑']]],
  ['账号运营',[['nurture','⑧ 养号清单'],['account','⑨ 账号管理'],['ops','⑩ 运营台账']]],
  ['增长实验',[['experiment','🧪 A/B实验'],['funnel','🔻 转化漏斗']]],
  ['辅助工具',[['calendar','📅 大促日历'],['compliance','🛡 文案合规自查'],['data','📊 数据与复盘'],['report','🧾 一周战报'],['aeo','🤖 AI搜索(AEO)'],['settings','🔧 系统设置'],['system','⚙️ 系统状态']]],
];
let TAB='home', HOME={};

function buildNav(){
  $('#nav').innerHTML=MENU.map(([g,items])=>`<div class="group">${g}</div>`+items.map(([t,label])=>{
    const b=badge(t);
    return `<button data-t="${t}" class="${t===TAB?'on':''}">${label}${b?`<span class="badge">${b}</span>`:''}</button>`;
  }).join('')).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;buildNav();render();$('#nav').classList.remove('open');window.scrollTo(0,0);});
}
function badge(t){
  if(t==='review')return HOME.to_review;
  if(t==='queue')return HOME.due_publish;
  if(t==='comment')return HOME.comments_pending;
  if(t==='inbox')return HOME.inbox_pending;
  if(t==='mentions')return HOME.mentions_new;
  if(t==='lead')return HOME.overdue_leads;
  return 0;
}

api('GET','/api/health').then(h=>$('#llm').textContent='AI: '+h.llm_provider+(h.auth?' 🔒':''));
api('GET','/api/datasource/status').then(d=>$('#ds').textContent='数据源: '+(d.mode==='crawler'?'真实爬虫':'演示数据'));
api('GET','/api/watchdog').then(w=>$('#wd').textContent='🐶'+(w.consecutive_failures===0?'看门狗正常':'⚠️异常'+w.consecutive_failures)).catch(()=>{});

async function refreshHome(){try{HOME=await api('GET','/api/home');}catch(e){HOME={};}buildNav();}

async function render(){
  const v=$('#view');v.innerHTML='<div class="empty">加载中…</div>';
  try{ await VIEWS[TAB](v); }catch(e){ v.innerHTML=`<div class="card" style="color:var(--red)">出错：${esc(e.message)}</div>`; }
}

const VIEWS={
  // ============ 今日待办首页 ============
  async home(v){
    HOME=await api('GET','/api/home');buildNav();
    let ds={mode:'mock'};try{ds=await api('GET','/api/datasource/status');}catch(e){}
    const cards=[
      ['to_review','📝 去审核草稿','review',HOME.to_review,false],
      ['due_publish','📤 去发布','queue',HOME.due_publish,true],
      ['comments_pending','💬 处理评论','comment',HOME.comments_pending,false],
      ['nurture_left','🌱 养号打卡','nurture',HOME.nurture_left,false],
      ['overdue_leads','📥 跟进线索','lead',HOME.overdue_leads,true],
      ['data_missing','📊 补录数据','queue',HOME.data_missing,false],
    ];
    v.innerHTML=`
    <div class="guide">👋 <b>欢迎使用内容矩阵工作台</b>。这套系统帮你管好"做内容 → 发出去 → 引流量 → 变订单"的全过程。
    下面是<b>今天要做的事</b>，点卡片直接去处理。每个页面顶部都有黄色说明，照着做即可，<b>不用培训</b>。</div>
    ${ds.mode==='mock'?`<div class="card" style="border-color:#ecddc6;background:#fcf8f1"><h3>🚀 首次使用？先做 3 步</h3>
      <div class="kv">1️⃣ 去 <b>🔧系统设置</b> 填「采集器地址」→ 全站演示数据换成真实数据<br>
      2️⃣ 填「飞书 Webhook」→ 待办提醒推到群里<br>
      3️⃣ 配真实大模型 Key（改 .env 的 LLM_PROVIDER）→ AI 文案更好</div>
      <button class="act" style="margin-top:10px" onclick="go('settings')">去系统设置 →</button></div>`:''}
    <div class="card"><h3>📋 今日待办 <span class="sub">点卡片直接去做</span></h3>
      <div class="stat">${cards.map(([k,lbl,tab,n,urg])=>`
        <div class="c ${urg&&n?'urgent':''}" onclick="go('${tab}')"><div class="num">${n??0}</div><div class="lbl">${lbl}</div></div>`).join('')}
        <div class="c" onclick="go('ops')"><div class="num">${HOME.ops_done}/${HOME.ops_total}</div><div class="lbl">✅ 运营打卡</div></div>
      </div></div>
    <div class="card"><h3>🗺 完整流程（新手必读）</h3>
      <div class="steps">
        <div class="s"><span class="n">1</span><b>选题与生成</b>系统给家具选题，AI 自动写小红书文案</div>
        <div class="s"><span class="n">2</span><b>审核工位</b>30秒检查一篇，敏感词/AI感不过关会拦住</div>
        <div class="s"><span class="n">3</span><b>发布队列</b>系统自动错峰排好，你照卡片人工发出</div>
        <div class="s"><span class="n">4</span><b>评论引流</b>系统找上升期笔记，你点发AI写好的评论</div>
        <div class="s"><span class="n">5</span><b>线索收件箱</b>有人来问，用话术库回，成交回填订单号</div>
        <div class="s"><span class="n">6</span><b>数据复盘</b>录入数据，系统告诉你哪类内容最有效</div>
      </div>
      <div class="muted">⚠️ 重要：本系统所有"自动"都是<b>帮你准备好、由你点发</b>，绝不自动操作账号——这是小红书不封号的唯一安全做法。</div>
    </div>`;
  },

  // ============ ①② 选题与生成 ============
  async pipe(v){
    v.innerHTML=`<div class="guide">📝 <b>第一步：做内容</b>。先选一个产品分类「生成选题」，系统会给出几个选题（🌲常青=能火很久的搜索内容，🔥时效=蹭当下热点）。
    然后在选题卡片上选一个账号「生成草稿」，AI 会自动写好文案 → 去③审核工位检查。</div>
    <div class="card"><h3>① 生成选题 <span class="sub">家具是"先搜索后下单"，常青选题更值钱</span></h3>
      <div class="row"><select id="cat">${['餐桌','餐椅','茶几','柜类','床'].map(c=>`<option>${c}</option>`).join('')}</select>
      <input id="cnt" type="number" value="3" style="width:64px"><button class="act" id="gt">生成选题</button>
      <button class="ghost" id="seedall">🚀 一键预热（各品类自动出选题+草稿）</button></div>
      <div id="topics" class="grid" style="margin-top:12px"></div></div>
      <div class="card"><h3>③ 待审核草稿</h3><div class="muted">生成后会出现在这里，数值类描述(如"1.2米""1999元")会自动标记待你核实。</div>
      <div id="drafts" class="grid" style="margin-top:12px"></div></div>`;
    $('#gt').onclick=async()=>{await api('POST','/api/topics/generate',{category:$('#cat').value,count:+$('#cnt').value});loadTopics();};
    $('#seedall').onclick=async()=>{toast('预热生成中…');const r=await api('POST','/api/content/seed-batch?per_category=2');toast(`已生成 ${r.topics} 选题 / ${r.drafts} 草稿`);loadTopics();loadDrafts();refreshHome();};
    const accs=await api('GET','/api/accounts');
    async function loadTopics(){
      const ts=await api('GET','/api/topics');
      $('#topics').innerHTML=ts.map(t=>`<div class="card" style="margin:0">
        <span class="pill ${t.kind==='evergreen'?'':'b'}">${t.kind==='evergreen'?'🌲常青':'🔥时效'}</span>
        <div class="kv" style="margin:6px 0"><b>${esc(t.title)}</b></div><div class="muted">热度 ${t.heat_score} · ${t.category}</div>
        <div class="row" style="margin-top:8px"><select class="acc">${accs.map(a=>`<option value="${a.id}">${esc(a.nickname)}</option>`).join('')}</select>
        <button class="ghost gd" data-id="${t.id}">生成图文</button>
        <button class="ghost gv" data-id="${t.id}">🎬口播脚本</button></div></div>`).join('')||'<div class="empty">点上方生成选题</div>';
      $('#topics').querySelectorAll('.gd').forEach(b=>b.onclick=async()=>{
        const acc=b.closest('.card').querySelector('.acc').value;
        try{await api('POST','/api/drafts/generate',{topic_id:+b.dataset.id,account_id:+acc});loadDrafts();toast('草稿已生成，去③审核');}catch(e){alert(e.message);}});
      $('#topics').querySelectorAll('.gv').forEach(b=>b.onclick=async()=>{
        const acc=b.closest('.card').querySelector('.acc').value;
        try{await api('POST','/api/drafts/video',{topic_id:+b.dataset.id,account_id:+acc});loadDrafts();toast('口播脚本已生成，去③审核');}catch(e){alert(e.message);}});
    }
    async function loadDrafts(){
      const ds=(await api('GET','/api/drafts')).filter(d=>d.status==='drafted');
      $('#drafts').innerHTML=ds.map(d=>`<div class="card" style="margin:0"><div class="kv"><b>${esc(d.title)}</b></div>
        <div class="muted">AI感 ${d.ai_likeness}（越低越像真人）</div>
        <button class="ghost" style="margin-top:8px" onclick="openReview(${d.id})">去审核 →</button></div>`).join('')||'<div class="empty">暂无待审核草稿</div>';
    }
    loadTopics();loadDrafts();
  },

  async review(v){
    const ds=await api('GET','/api/drafts');
    v.innerHTML=`<div class="guide">🔍 <b>第二步：审核（目标30秒/篇）</b>。左边是文案，<span class="hl">黄色高亮</span>是有问题的词；右边三张体检报告，红色"阻塞"的必须改。
    确认没问题点「通过」，通过后去④发布队列排发布。</div>
    <div class="card"><div class="row"><span>选草稿：</span><select id="pick">${ds.map(d=>`<option value="${d.id}">#${d.id} ${esc(d.title)}（${d.status}）</option>`).join('')}</select>
      <button class="act" id="open">打开</button></div></div><div id="rv"></div>`;
    $('#open').onclick=()=>openReview(+$('#pick').value);
    if(ds.length)openReview(ds[0].id);
  },

  async queue(v){
    const [ds,accs,q]=await Promise.all([api('GET','/api/drafts'),api('GET','/api/accounts'),api('GET','/api/dispatch/queue')]);
    const approved=ds.filter(d=>d.status==='approved');
    const active=accs.filter(a=>a.stage==='active'&&a.health_flag==='green');
    v.innerHTML=`<div class="guide">📤 <b>第三步：发布</b>。选一篇审核通过的稿 + 几个账号「排发布」，系统会<b>自动错开时间、打散标签</b>（防止被平台识别为矩阵号）。
    然后到点时点「📋卡片」复制文案，去 App 人工发出，发完点「✅已发」。发布后记得「录数据」。</div>
    <div class="card"><h3>排发布 <span class="sub">仅正式期+健康正常的号可选</span></h3>
      ${approved.length&&active.length?`<div class="row">
        <select id="qd">${approved.map(d=>`<option value="${d.id}">${esc(d.title)}</option>`).join('')}</select>
        <select id="qa" multiple size="3" title="按住Ctrl多选" style="min-width:160px">${active.map(a=>`<option value="${a.id}">${esc(a.nickname)}</option>`).join('')}</select>
        <button class="act" id="qs">排发布</button></div><div class="muted" style="margin-top:6px">按住 Ctrl/⌘ 可多选账号；多个号会自动错峰20-45分钟</div>`
      :`<div class="empty">${approved.length?'没有可用账号（需正式期+绿色健康）':'没有审核通过的稿件，先去③审核通过一篇'}</div>`}
    </div>

    <div class="card" style="overflow-x:auto"><table><thead><tr><th>账号</th>${head}</tr></thead><tbody>${cal.accounts.map(a=>`<tr>
      <td><b>${esc(a.nickname)}</b><br><span class="muted">${a.stage==='active'?'正式':a.stage==='trial'?'试发':'养号'}</span></td>
      ${cal.dates.map(d=>{const cells=a.cells[d]||[];return `<td>${cells.map(c=>`<div class="pill ${c.result==='success'?'':'b'}" style="display:block;margin:1px 0;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(c.title)}">${esc(c.title)}</div>`).join('')||'<span class="muted">·</span>'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;
  },
};

window.go=t=>{TAB=t;buildNav();render();};

window.openReview=async id=>{
  TAB='review';buildNav();
  const [r,events]=await Promise.all([api('GET',`/api/review/${id}`),api('GET',`/api/content/${id}/events`)]);
  let body=esc(r.body);r.highlights.forEach(h=>{body=body.replaceAll(esc(h.word),`<span class="hl">${esc(h.word)}⚠️${h.level}</span>`);});
  const claims=(r.fact_check&&r.fact_check.pending_human)||[];
  $('#view').innerHTML=`<div class="guide">🔍 审核中：<b>${esc(r.title)}</b>。左边检查文案，右边看体检。红色"阻塞"必须改了才能通过。</div>
  <div class="card"><div class="grid"><div><h3>文案（黄色是问题词）</h3><div class="kv card" style="margin:0">${body.replaceAll('\n','<br>')}</div>
    <div class="muted" style="margin-top:8px">标签：${(r.tags||[]).map(t=>'#'+esc(t)).join(' ')}</div>
    <h3 style="margin-top:12px">这篇经历了什么</h3><div class="timeline">${events.map(e=>`<div>${new Date(e.at).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})} · ${e.event_type}</div>`).join('')||'—'}</div></div>
    <div><h3>三张体检报告</h3>
      <div class="kv">AI感：<b>${r.reports.ai_likeness.score}</b>/100 ${r.reports.ai_likeness.block?'<span class="pill r">太像AI·阻塞</span>':'<span class="pill">像真人·OK</span>'}</div>
      <div class="kv">信息密度：${r.reports.info_density}（越高越干货）</div>
      <div class="kv">敏感词：S${(r.reports.banned_words.S||[]).length} A${(r.reports.banned_words.A||[]).length} B${(r.reports.banned_words.B||[]).length}</div>
      ${claims.length?`<div class="kv">⚠️ ${claims.length}处数值待你核实：${claims.map(c=>`<span class="hl">${esc(c)}</span>`).join(' ')}</div>`:'<div class="kv">✅ 无数值需核实</div>'}
      <h3 style="margin-top:12px">必改3处</h3>
      <div class="kv">☐ 首图文字覆盖率 ${r.must_fix.cover_text_density}</div>
      <div class="kv">☐ 营销话术：${r.must_fix.para2_marketing}</div>
      <div class="kv">☐ 个人化细节 ${r.must_fix.personal_anchor_count} 处（"我家""上次"越多越真实）</div>
      ${r.rewrite_candidates.length?`<h3 style="margin-top:12px">改写参考</h3>${r.rewrite_candidates.map(c=>`<div class="kv card" style="margin:4px 0">${esc(c)}</div>`).join('')}`:''}
    </div></div>
    ${r.blockers.length?`<div class="kv" style="color:var(--red);margin-top:10px">⛔ ${r.blockers.map(esc).join('；')}</div>`:''}
    <div class="row" style="margin-top:14px">
      <button class="act" ${r.can_approve&&r.status==='drafted'?'':'disabled'} onclick="rev(${id},'approve')">✅ 通过</button>
      <button class="ghost" onclick="rev(${id},'reject')">✗ 拒绝</button>
      <button class="ghost" onclick="titleAB(${id})">🎯 标题A/B候选</button>
      <button class="ghost" onclick="avRender(${id})">🎭 数字人渲染(口播脚本)</button>
      ${r.status==='approved'?'<span class="muted">已通过 → 去④发布队列</span>':r.status==='scheduled'?'<span class="muted">已在发布队列</span>':r.status==='published'?'<span class="muted">已全部发出</span>':''}
    </div></div>`;
};
window.rev=async(id,act)=>{try{await api('POST',`/api/review/${id}/${act}`,{note:'已审核',reason:'不符合调性'});refreshHome();}catch(e){alert(e.message);}openReview(id);};
window.cact=async(id,act)=>{try{await api('POST',`/api/comments/${id}/${act}`);}catch(e){alert(e.message);}refreshHome();render();};
window.nchk=async(id,acc)=>{await api('POST',`/api/nurture/task/${id}/check`);refreshHome();loadN(acc);};
window.nprom=async id=>{const r=await api('POST',`/api/nurture/${id}/promote`);alert(r.promoted?('🎉 已晋级到 '+(r.stage==='active'?'正式期':'试发期')):('暂不能晋级：'+r.reason));};
window.lwin=async id=>{const no=prompt('回填 ERP 订单号（成交归因用）：','SO'+Date.now());if(no){await api('POST',`/api/leads/${id}/won`,{erp_order_no:no});render();}};
window.showCard=async id=>{const c=await api('GET',`/api/dispatch/${id}/card`);const box=$('#cardbox');box.style.display='block';
  box.innerHTML=`<h3>📋 复制去发（${c.reminder}）</h3>
    <div class="kv"><b>标题</b> <button class="ghost copybtn" onclick="copy('${esc(c.clipboard['1_title']).replace(/'/g,"")}')">复制</button><br>${esc(c.clipboard['1_title'])}</div>
    <div class="kv" style="margin-top:8px"><b>正文</b> <button class="ghost copybtn" onclick="copy(window._body)">复制</button><br>${esc(c.clipboard['2_body']).replaceAll('\n','<br>')}</div>
    <div class="kv" style="margin-top:8px"><b>标签</b> <button class="ghost copybtn" onclick="copy('${esc(c.clipboard['3_tags']).replace(/'/g,"")}')">复制</button><br>${esc(c.clipboard['3_tags'])}</div>`;
  window._body=c.clipboard['2_body'];box.scrollIntoView({behavior:'smooth'});};
window.markPub=async id=>{try{await api('POST',`/api/dispatch/${id}/published`);refreshHome();}catch(e){alert(e.message);}render();};
window.recData=async(cid,aid)=>{
  const views=+prompt('这篇的浏览量/小眼睛？','1000')||0;if(!views)return;
  const likes=+prompt('点赞数？','50')||0;const comments=+prompt('评论数？','10')||0;const collects=+prompt('收藏数？','20')||0;
  const ql=comments?(+prompt(`${comments}条评论里，"提问型"有几条？`,'3')||0):0;
  const ll=comments?(+prompt('超过15字的"长评论"有几条？','4')||0):0;
  await api('POST','/api/metrics',{content_id:cid,account_id:aid,views,likes,comments,collects,question_comments:ql,long_comments:ll});
  refreshHome();render();toast('数据已录入');};
window.zset=async(id,s)=>{if(s){await api('POST',`/api/zhihu/${id}`,{status:s});render();}};
window.zurl=async id=>{const u=prompt('粘贴知乎回答链接：');if(u){await api('POST',`/api/zhihu/${id}`,{answer_url:u});render();}};
window.zgen=async id=>{toast('AI 生成中…');await api('POST',`/api/zhihu/${id}/generate`);render();toast('初稿已生成');};
window.zview=async id=>{const qs=await api('GET','/api/zhihu');const z=qs.find(x=>x.id===id);const box=$('#zbox');box.style.display='block';
  box.innerHTML=`<h3>📄 ${esc(z.question)} <button class="ghost copybtn" onclick="copy(window._zd)">复制全文</button></h3>
    <div class="kv" style="white-space:pre-wrap;background:#faf8f4;padding:12px;border-radius:8px">${esc(z.answer_draft)}</div>`;
  window._zd=z.answer_draft;box.scrollIntoView({behavior:'smooth'});};
window.opstog=async id=>{await api('POST',`/api/ops/task/${id}/toggle`);refreshHome();render();};
window.ibreplied=async id=>{await api('POST',`/api/inbox/comments/${id}/replied`);refreshHome();render();};
window.ibtolead=async id=>{await api('POST',`/api/inbox/comments/${id}/to-lead`);toast('已转入线索收件箱');refreshHome();render();};
window.mhandle=async id=>{await api('POST',`/api/mentions/${id}/handled`);refreshHome();render();};
window.genVideo=async(tid,acc)=>{await api('POST','/api/drafts/video',{topic_id:tid,account_id:acc});toast('口播脚本已生成，去审核工位');render();};
window.titleAB=async id=>{const r=await api('POST',`/api/drafts/${id}/title-variants`);alert('标题A/B候选：\n\n'+r.variants.join('\n'));};
window.autoCollect=async()=>{const r=await api('POST','/api/metrics/auto-collect');toast(`自动回采 ${r.collected} 篇数据`);refreshHome();render();};
window.riskSignal=async id=>{const s=prompt('风控信号(captcha滑块/throttled限流/note_hidden笔记被隐藏)：','throttled');if(s){await api('POST',`/api/accounts/${id}/risk-signal`,{signal:s});render();}};
window.saveSet=async key=>{await api('POST',`/api/settings/${key}`,{value:document.getElementById('set_'+key).value});toast('已保存，即时生效');render();};
window.avAuth=async id=>{await api('POST',`/api/avatars/${id}/authorize`);toast('已登记授权');render();};
window.avDM=async id=>{const t=document.getElementById('dmt_'+id).value,s=document.getElementById('dms_'+id).value;if(!s)return alert('填私信内容');try{await api('POST','/api/avatars/render/dm',{avatar_id:id,target:t,script:s});toast('私信视频已生成');render();}catch(e){alert(e.message);}};
window.avRender=async(draftId)=>{const av=prompt('用哪个数字人ID渲染？');if(av){try{await api('POST','/api/avatars/render/draft',{draft_id:draftId,avatar_id:+av});toast('已提交渲染，看数字人工作室');}catch(e){alert(e.message);}}};
window.exRec=async(id,arm)=>{const rw=document.getElementById('rw_'+id+'_'+arm).value;await api('POST',`/api/experiments/${id}/result`,{arm,reward:+rw||0});render();};
window.exReco=async id=>{const r=await api('GET',`/api/experiments/${id}/recommend`);alert('建议试：'+r.recommend+'\n'+r.reason);};
window.exDone=async id=>{const r=await api('POST',`/api/experiments/${id}/conclude`);alert('胜出：'+r.winner);render();};
window.editAcc=id=>{
  const a=window._accs.find(x=>x.id===id);const box=$('#accedit');box.style.display='block';
  const items=['企业认证','开通店铺组件','开通群聊(私域)','完善合集/瞬间'];const setup=a.official_setup||{};
  box.innerHTML=`<h3>编辑：${esc(a.nickname)}</h3>
    <div class="kv">绑定真人（人设号建议填同事名）<br><input id="ea_rp" value="${esc(a.real_person)}" placeholder="如：小王"></div>
    <div class="kv" style="margin-top:6px">绑定设备<br><input id="ea_dev" value="${esc(a.device_note)}" placeholder="如：iPhone13-A / 备用机"></div>
    <div class="kv" style="margin-top:6px">绑定手机卡<br><input id="ea_sim" value="${esc(a.sim_note)}" placeholder="如：138xxxx"></div>
    ${a.role==='brand'?`<div class="kv" style="margin-top:6px">官方功能开通（专业号合法引流通道，建议全开）<br>${items.map(it=>`<label style="margin-right:10px"><input type="checkbox" class="ea_of" value="${it}" ${setup[it]?'checked':''}>${it}</label>`).join('')}</div>`:''}
    <button class="act" style="margin-top:10px" onclick="saveAcc(${id})">保存</button>`;
  box.scrollIntoView({behavior:'smooth'});};
window.saveAcc=async id=>{
  const of={};document.querySelectorAll('.ea_of').forEach(c=>of[c.value]=c.checked);
  await api('PATCH',`/api/accounts/${id}/profile`,{real_person:$('#ea_rp').value,device_note:$('#ea_dev').value,sim_note:$('#ea_sim').value,official_setup:of});
  render();toast('已保存');};

(async()=>{await refreshHome();render();})();
</script>
</body>
</html>
