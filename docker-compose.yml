services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-panse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panse_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-panse_erp}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backups:/backups        # 备份输出到主机目录
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-panse}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Phase 13: 资源限制 — 防止单个容器吃满主机内存
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2'
        reservations:
          memory: 512m

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_COMMIT_MSG: ${GIT_COMMIT_MSG:-}
        GIT_COMMIT_DATE: ${GIT_COMMIT_DATE:-}
        GIT_BRANCH: ${GIT_BRANCH:-}
        BUILD_TIME: ${BUILD_TIME:-}
    restart: unless-stopped     # 业务需求: 看门狗触发 SIGTERM 后 Docker 自动拉起
    depends_on:
      db:
        condition: service_healthy
    # 不用 --reload(Dockerfile 默认带): 单进程跑, 看门狗 SIGTERM 才能真正退出容器→Docker(unless-stopped)拉起;
    # 也避免热重载在大导入/文件变动时卡死。改代码后点「拉最新代码+重建」生效。
    command: >
      sh -c "alembic upgrade head &&
             python -m app.cli.campaign_seed_sku_slots &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-panse}:${POSTGRES_PASSWORD:-panse_dev_pw}@db:5432/${POSTGRES_DB:-panse_erp}
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      # 产品图库根目录 (容器内路径)。迁群晖时只改下方 volumes 的主机侧路径即可。
      GALLERY_ROOT: /app/gallery
      # Panse-Web-Agent 自动取数 (2026-06-12 并入): Agent 跑在 Windows 宿主机 :8500
      # 群晖部署时改成 Windows 机的局域网 IP, 如 http://192.168.x.x:8500
      WEB_AGENT_URL: ${WEB_AGENT_URL:-http://host.docker.internal:8500}
      PROCUREMENT_AGENT_TOKEN: ${PROCUREMENT_AGENT_TOKEN:-}
      AGENT_OUTPUT_DIR: /app/agent_output
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux Docker(群晖)也能解析宿主机
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./TAOBAO_CAMPAIGN_SIGNUP_POLICY.json:/app/TAOBAO_CAMPAIGN_SIGNUP_POLICY.json:ro
      - ./storage:/app/storage   # 送货单原图归档 + 上传文件 + 图库缩略图缓存
      - ./backups:/backups:ro    # 只读: 供"系统体检"报告最新备份新鲜度 (优化 #4)
      - "D:/畔色 产品图库:/app/gallery:ro"   # 产品图库 (只读; 群晖部署改这一行主机路径)
      # Web-Agent 下载产物 (只读; 群晖部署改为共享目录挂载)
      - "D:/AI/Panse-Web-Agent/data/output:/app/agent_output:ro"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health\", timeout=3)' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Phase 13: 内存限制 + reservation
    deploy:
      resources:
        limits:
          memory: 3g            # 大 Excel 导入时 + OCR 缓存
          cpus: '2'
        reservations:
          memory: 1g

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1'

  # Phase 13: 自动备份 — 每天 03:00 dump 数据库到 ./backups
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGUSER: ${POSTGRES_USER:-panse}
      PGPASSWORD: ${POSTGRES_PASSWORD:-panse_dev_pw}
      PGDATABASE: ${POSTGRES_DB:-panse_erp}
      PGHOST: db
    volumes:
      - ./backups:/backups
    entrypoint:
      - bash
      - -c
      - |
        echo "[backup] 启动. 每天 03:00 备份, 保留 30 天."
        set -o pipefail   # pg_dump 经管道失败时, 不被 gzip 的 exit 0 掩盖成"成功"
        while :; do
          # 计算到下个 03:00 的秒数 (10# 强制十进制, 避免 08/09 被当八进制)
          now_h=$$(date +%H); now_m=$$(date +%M); now_s=$$(date +%S)
          target_s=$$((3*3600))
          cur_s=$$((10#$$now_h*3600 + 10#$$now_m*60 + 10#$$now_s))
          if [ $$cur_s -lt $$target_s ]; then
            sleep_s=$$((target_s - cur_s))
          else
            sleep_s=$$((86400 - cur_s + target_s))
          fi
          echo "[backup] 等 $$sleep_s 秒到下个 03:00"
          sleep $$sleep_s
          fname="/backups/panse-$$(date +%Y%m%d-%H%M%S).sql.gz"
          echo "[backup] dump → $$fname"
          if pg_dump | gzip > "$$fname"; then
            sz=$$(stat -c%s "$$fname" 2>/dev/null || echo 0)
            if [ "$$sz" -gt 100 ]; then
              echo "[backup] OK $$(ls -lh $$fname | awk '{print $$5}')"
              # 仅本次成功后才清理旧备份, 避免连续失败把好备份删光
              find /backups -name 'panse-*.sql.gz' -mtime +30 -delete
            else
              echo "[backup] 失败: 产物过小 ($$sz 字节), 删坏文件并保留旧备份"; rm -f "$$fname"
            fi
          else
            echo "[backup] pg_dump 失败, 删半成品并保留旧备份"; rm -f "$$fname"
          fi
        done
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  pg_data:
