services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-panse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panse_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-panse_erp}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backups:/backups        # 备份输出到主机目录
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-panse}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Phase 13: 资源限制 — 防止单个容器吃满主机内存
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2'
        reservations:
          memory: 512m

  api:
    build: ./backend
    restart: unless-stopped     # 业务需求: 看门狗触发 SIGTERM 后 Docker 自动拉起
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-panse}:${POSTGRES_PASSWORD:-panse_dev_pw}@db:5432/${POSTGRES_DB:-panse_erp}
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage   # 送货单原图归档 + 上传文件
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health\", timeout=3)' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Phase 13: 内存限制 + reservation
    deploy:
      resources:
        limits:
          memory: 3g            # 大 Excel 导入时 + OCR 缓存
          cpus: '2'
        reservations:
          memory: 1g

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1'

  # Phase 13: 自动备份 — 每天 03:00 dump 数据库到 ./backups
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGUSER: ${POSTGRES_USER:-panse}
      PGPASSWORD: ${POSTGRES_PASSWORD:-panse_dev_pw}
      PGDATABASE: ${POSTGRES_DB:-panse_erp}
      PGHOST: db
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        echo "[backup] 启动. 每天 03:00 备份, 保留 30 天."
        while :; do
          # 计算到下个 03:00 的秒数
          now_h=$$(date +%H); now_m=$$(date +%M); now_s=$$(date +%S)
          target_s=$$((3*3600))
          cur_s=$$((10#$$now_h*3600 + 10#$$now_m*60 + 10#$$now_s))
          if [ $$cur_s -lt $$target_s ]; then
            sleep_s=$$((target_s - cur_s))
          else
            sleep_s=$$((86400 - cur_s + target_s))
          fi
          echo "[backup] 等 $$sleep_s 秒到下个 03:00"
          sleep $$sleep_s
          fname="/backups/panse-$$(date +%Y%m%d-%H%M%S).sql.gz"
          echo "[backup] dump → $$fname"
          pg_dump | gzip > "$$fname" && echo "[backup] OK $$(ls -lh $$fname | awk '{print $$5}')"
          # 保留 30 天
          find /backups -name 'panse-*.sql.gz' -mtime +30 -delete
        done
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  pg_data:
